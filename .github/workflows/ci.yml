name: CI

# Corporate CI (engine module):
# - Cross-platform: Linux, macOS, Windows
# - Go 1.26+ (matches go.mod)
# - CGO_ENABLED=0

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "ERROR: The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        if: matrix.os != 'windows-latest'
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test (windows, no race — race requires CGO)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Vulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
